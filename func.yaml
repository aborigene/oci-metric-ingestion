schema_version: 20180708
name: oci-metric-ingestion
version: 0.1.0
runtime: python
build_image: fnproject/python:3.11-dev
run_image: fnproject/python:3.11
entrypoint: /python/bin/fdk /function/func.py handler
memory: 256
timeout: 120 # seconds; delivery may retry for up to RETRY_BUDGET_SECONDS (45s) before giving up
config:
  DYNATRACE_TENANT: <Tenant URL>

  AUTH_METHOD: "token" # Can be either `oauth` or `token` - fill out their respective sections below
  # OAuth 
  OAUTH_CLIENT_ID: <OAuth Client ID>
  OAUTH_CLIENT_SECRET: <OAuth Client Secret>
  OAUTH_ACCOUNT_URN: <OAuth Client Account URN>
  # Token
  DYNATRACE_API_KEY: <API Key with the 'metrics.ingest' scope>

  # Optional - Proxy connection information
  PROXY_URL: <Proxy URL>
  # Optional
  PROXY_USERNAME: <Proxy Username>
  # Optional
  PROXY_PASSWORD: <Proxy Password>
  # Set this to True to also ingest namespaces that have no curated mapping in the
  # 'Oracle Cloud Infrastructure' extension (for example oci_streaming). Namespaces that DO have a mapping always
  # keep their curated metric keys and dimensions, whatever this is set to.
  # Unmapped namespaces are ingested with the key cloud.oci.<namespace without 'oci_'>.<metric name>
  # Ex: "PutMessagesLatency.Time" from "oci_streaming" -> "cloud.oci.streaming.PutMessagesLatency.Time"
  # and with ALL their OCI dimensions (oci.resource_id, oci.region, oci.compartment_id, oci.resource_group, ...),
  # plus cloud.provider=oci and oci.service=<namespace without 'oci_'>. See the README.
  # When False, an unmapped namespace is skipped (logged once per namespace).
  IMPORT_ALL_METRICS: "False"
  # DEBUG logs every payload and MINT line (very verbose). Defaults to INFO when unset.
  LOG_LEVEL: "INFO"

  # Optional - delivery tuning. All values below are the defaults and may be removed.
  # Set to "true" to log the MINT lines instead of sending them to Dynatrace (no credentials needed).
  DRY_RUN: "false"
  # Maximum size of one ingest request in bytes (the Dynatrace API limit is 1 MB).
  MAX_PAYLOAD_BYTES: "900000"
  # Maximum number of lines in one ingest request.
  MAX_LINES_PER_REQUEST: "500"
  # Total time in seconds spent retrying 429 / 5xx / timeouts per invocation. Dynatrace drops metrics
  # older than one hour, so do not make this large. After the budget the invocation fails and
  # Connector Hub redelivers the batch.
  RETRY_BUDGET_SECONDS: "45"
  # Curated namespaces historically send only the most recent minute of every payload. Set to "true" to send
  # every minute in the payload (more lines, same series, no gaps). See CHANGES.md.
  CURATED_SEND_ALL_BUCKETS: "false"

  # Optional - only ingest metrics from these compartments (comma, semicolon or whitespace separated OCIDs).
  # Exact match on the compartment OCID in the metric; sub-compartments are NOT included automatically.
  # COMPARTMENT_ALLOWLIST: ocid1.compartment.oc1..aaaa,ocid1.compartment.oc1..bbbb
  # Optional - never ingest metrics from these compartments. Takes precedence over COMPARTMENT_ALLOWLIST.
  # COMPARTMENT_DENYLIST: ocid1.compartment.oc1..cccc
  # Note: all OCI Function configuration values together are limited to 4 KB (about 30-40 OCIDs).
